<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fruit stack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <script>
    (function () {
      try {
        var k = 'fruit-stack-theme';
        var t = localStorage.getItem(k);
        if (t !== 'dark' && t !== 'light') {
          t = 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: light;
      --bg: #e8dcc4;
      --text: #2a2218;
      --bar-bg: rgba(236, 226, 206, 0.96);
      --bar-border: rgba(58, 44, 28, 0.12);
      --btn-bg: #f0e6d2;
      --btn-border: rgba(58, 44, 28, 0.18);
      --btn-text: #3a3026;
      --btn-hover-border: rgba(58, 44, 28, 0.34);
      --btn-active-bg: #2a2218;
      --btn-active-text: #f5ead8;
      --btn-active-border: #2a2218;
      --icon-btn-bg: #e0d2b8;
      --icon-btn-color: #453a30;
      --icon-btn-border: rgba(58, 44, 28, 0.2);
      --icon-btn-hover-bg: #d4c4a8;
      --icon-btn-hover-color: #2a2218;
      --icon-btn-hover-border: rgba(58, 44, 28, 0.3);
      --gyro-text: #564a3e;
      --gyro-btn-border: #2a2218;
      --gyro-btn-bg: #2a2218;
      --gyro-btn-fg: #f5ead8;
      --err: #b00020;
      --hint: #1a1510;
    }
    html[data-theme='dark'] {
      color-scheme: dark;
      --bg: #0c0c0c;
      --text: #f2f2f2;
      --bar-bg: rgba(22, 22, 22, 0.94);
      --bar-border: rgba(255, 255, 255, 0.08);
      --btn-bg: #1e1e1e;
      --btn-border: rgba(255, 255, 255, 0.14);
      --btn-text: #e8e8e8;
      --btn-hover-border: rgba(255, 255, 255, 0.32);
      --btn-active-bg: #f0f0f0;
      --btn-active-text: #111;
      --btn-active-border: #f0f0f0;
      --icon-btn-bg: #2a2a2a;
      --icon-btn-color: #ddd;
      --icon-btn-border: rgba(255, 255, 255, 0.14);
      --icon-btn-hover-bg: #363636;
      --icon-btn-hover-color: #fff;
      --icon-btn-hover-border: rgba(255, 255, 255, 0.22);
      --gyro-text: #aaa;
      --gyro-btn-border: #e8e8e8;
      --gyro-btn-bg: #e8e8e8;
      --gyro-btn-fg: #111;
      --err: #ff8a80;
      --hint: #f0ece8;
    }
    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      cursor: crosshair;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #stage {
      position: fixed;
      inset: 0;
      touch-action: none;
    }
    .fruit {
      position: absolute;
      left: 0;
      top: 0;
      width: 120px;
      height: 120px;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      will-change: transform;
    }
    /* Mode bar: desktop tweaks in @media (min-width: 641px); mobile in @media (max-width: 640px). */
    #mode-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 12px max(10px, env(safe-area-inset-bottom));
      background: var(--bar-bg);
      border-top: 1px solid var(--bar-border);
      pointer-events: auto;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      font-family: 'Averia Serif Libre', Georgia, 'Times New Roman', serif;
    }
    /* Buttons do not reliably inherit font-family from <nav> in UA styles. */
    #mode-bar button {
      font-family: 'Averia Serif Libre', Georgia, 'Times New Roman', serif;
    }
    .mode-bar__main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      column-gap: 20px;
      width: 100%;
    }
    .mode-bar__controls-row {
      display: contents;
    }
    .mode-bar__toolbar {
      display: contents;
    }
    .mode-bar__modes {
      grid-column: 2;
      justify-self: center;
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      justify-content: center;
      align-items: center;
      width: max-content;
      max-width: 100%;
    }
    .mode-bar__actions-icons {
      grid-column: 3;
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mode-bar__credit-group {
      grid-column: 1;
      justify-self: start;
      align-self: center;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: nowrap;
      padding-right: 10px;
      min-width: 0;
    }
    .mode-bar__credit {
      margin: 0;
      font-family: 'Averia Serif Libre', Georgia, 'Times New Roman', serif;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: var(--gyro-text);
      opacity: 0.88;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }
    a.mode-bar__download {
      font-family: 'Averia Serif Libre', Georgia, 'Times New Roman', serif;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: var(--gyro-text);
      opacity: 0.88;
      text-decoration: underline;
      text-underline-offset: 3px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    a.mode-bar__download:hover {
      opacity: 1;
    }
    .mode-bar__download--mobile {
      display: none;
    }
    #mode-bar button[data-mode] {
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 8px 10px;
      border: 1px solid var(--btn-border);
      border-radius: 8px;
      background: var(--btn-bg);
      color: var(--btn-text);
      cursor: pointer;
      white-space: nowrap;
    }
    #mode-bar button[data-mode]:hover {
      border-color: var(--btn-hover-border);
    }
    #mode-bar button[data-mode].is-active {
      background: var(--btn-active-bg);
      color: var(--btn-active-text);
      border-color: var(--btn-active-border);
    }
    #theme-toggle,
    #reset-fruits,
    #gyro-toggle {
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0;
      letter-spacing: 0;
      text-transform: none;
      color: var(--icon-btn-color);
      border: 1px solid var(--icon-btn-border);
      background: var(--icon-btn-bg);
      cursor: pointer;
    }
    #theme-toggle:hover,
    #reset-fruits:hover,
    #gyro-toggle:hover {
      background: var(--icon-btn-hover-bg);
      color: var(--icon-btn-hover-color);
      border-color: var(--icon-btn-hover-border);
    }
    /* On: same treatment as #mode-bar button[data-mode].is-active */
    #gyro-toggle.is-on {
      background: var(--btn-active-bg);
      color: var(--btn-active-text);
      border-color: var(--btn-active-border);
    }
    #gyro-toggle.is-on:hover {
      background: var(--btn-active-bg);
      color: var(--btn-active-text);
      border-color: var(--btn-hover-border);
    }
    #theme-toggle svg,
    #reset-fruits svg {
      display: block;
      width: 18px;
      height: 18px;
    }
    /* Raster tilt glyph: proportional to 18px SVGs in 36px chip. */
    #gyro-toggle img {
      display: block;
      width: 24px;
      height: 24px;
      object-fit: contain;
    }
    html[data-theme='dark'] #gyro-toggle img {
      filter: invert(1);
    }
    /* Active chip is dark (light theme) or light (dark theme); keep glyph contrast. */
    #gyro-toggle.is-on img {
      filter: invert(1);
    }
    html[data-theme='dark'] #gyro-toggle.is-on img {
      filter: none;
    }
    #theme-toggle .theme-icon--sun {
      display: none;
    }
    html[data-theme='dark'] #theme-toggle .theme-icon--moon {
      display: none;
    }
    html[data-theme='dark'] #theme-toggle .theme-icon--sun {
      display: block;
    }
    #gyro-prompt {
      display: none;
      width: 100%;
      text-align: center;
      font-size: 11px;
      color: var(--gyro-text);
      padding: 4px 0 0;
    }
    #gyro-prompt.is-visible {
      display: block;
    }
    #gyro-prompt #gyro-enable {
      margin-left: 8px;
      padding: 4px 10px;
      font-size: 11px;
      border-radius: 6px;
      border: 1px solid var(--gyro-btn-border);
      background: var(--gyro-btn-bg);
      color: var(--gyro-btn-fg);
      cursor: pointer;
    }
    .gyro-prompt__modern {
      display: none;
      justify-content: center;
      align-items: center;
    }
    #err {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--err);
      font-size: 14px;
      max-width: 320px;
      text-align: center;
      line-height: 1.5;
      z-index: 300;
    }
    #starter-hint {
      position: fixed;
      z-index: 120;
      left: 50%;
      top: calc(max(16px, env(safe-area-inset-top, 0px)) + 420px);
      transform: translateX(-50%);
      max-width: min(calc(340px * 3), calc(100vw - 48px));
      padding: 0 16px;
      pointer-events: none;
      text-align: center;
      font-family: 'Averia Serif Libre', Georgia, 'Times New Roman', serif;
      font-size: 3.15rem;
      line-height: 1.45;
      color: var(--hint);
    }
    #starter-hint[hidden] {
      display: none !important;
    }
    #starter-hint .starter-hint__lead {
      font-size: 3.36rem;
      font-weight: 700;
      margin: 0;
    }
    .starter-hint__mob-text {
      display: none;
    }
    .starter-hint__desk-text {
      display: inline;
    }

    /* Desktop: shorter bar; credits / modes / icons share one grid row, bottom-aligned (avoids modes on row 2). */
    @media (min-width: 641px) {
      #mode-bar {
        justify-content: flex-end;
        padding: 2px 12px max(10px, env(safe-area-inset-bottom));
        gap: 2px;
      }
      .mode-bar__credit-group,
      .mode-bar__modes,
      .mode-bar__actions-icons {
        grid-row: 1;
        align-self: center;
      }
    }

    /* Mobile: smaller fruit, centered hint, credits under controls */
    @media (max-width: 640px) {
      .fruit {
        width: 64px;
        height: 64px;
      }
      #starter-hint {
        font-size: calc(1.575rem * 1.3);
        line-height: 1.35;
        max-width: min(92vw, 280px);
        padding: 0 12px;
        text-align: center;
        /* left / top / transform set in JS from lone fruit spawn */
      }
      #starter-hint .starter-hint__lead {
        font-size: calc(1.68rem * 1.3);
        font-weight: 700;
        text-align: center;
      }
      .starter-hint__desk-text {
        display: none;
      }
      .starter-hint__mob-text {
        display: block;
      }
      .starter-hint__mob-line {
        display: block;
        white-space: nowrap;
        line-height: inherit;
      }
      #mode-bar {
        padding: 10px 10px max(10px, env(safe-area-inset-bottom));
      }
      #theme-toggle,
      #reset-fruits,
      #gyro-toggle {
        width: 36px;
        height: 36px;
      }
      #theme-toggle svg,
      #reset-fruits svg {
        width: 18px;
        height: 18px;
      }
      #gyro-toggle img {
        width: 24px;
        height: 24px;
        object-fit: contain;
        flex-shrink: 0;
      }
      .mode-bar__main {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        column-gap: 0;
      }
      .mode-bar__toolbar {
        display: flex;
        flex-direction: row;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
        width: 100%;
      }
      .mode-bar__controls-row {
        grid-column: unset;
        order: 1;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      #gyro-prompt {
        width: auto;
        padding-top: 0;
        text-align: center;
        flex-shrink: 0;
      }
      .mode-bar__actions-icons {
        flex-shrink: 0;
        flex-direction: row;
        gap: 8px;
      }
      .mode-bar__modes {
        width: 100%;
        flex: unset;
      }
      #gyro-prompt.is-visible {
        display: flex;
      }
      .gyro-prompt__legacy {
        display: none !important;
      }
      .gyro-prompt__modern {
        display: flex !important;
      }
      .mode-bar__credit-group {
        grid-column: unset;
        order: 2;
        justify-content: center;
        align-items: center;
        align-self: center;
        padding-right: 0;
        flex-wrap: wrap;
        gap: 8px 14px;
        max-width: 100%;
      }
      .mode-bar__modes {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        align-items: stretch;
      }
      #mode-bar button[data-mode] {
        padding: 8px 10px;
        min-height: 34px;
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .mode-bar__credit {
        white-space: normal;
        text-align: center;
      }
      a.mode-bar__download {
        white-space: normal;
        text-align: center;
      }
      .mode-bar__download--desktop {
        display: none;
      }
      .mode-bar__download--mobile {
        display: inline;
      }
    }
  </style>
</head>
<body>
  <div id="stage" aria-label="Fruit canvas"></div>
  <div id="starter-hint" hidden role="status">
    <p class="starter-hint__lead">
      <span class="starter-hint__desk-text">Click to add more fruit</span>
      <span class="starter-hint__mob-text">
        <span class="starter-hint__mob-line">click to add</span>
        <span class="starter-hint__mob-line">more fruit</span>
      </span>
    </p>
  </div>
  <nav id="mode-bar" aria-label="Display mode">
    <div class="mode-bar__main">
      <div class="mode-bar__credit-group">
        <p class="mode-bar__credit">© sam.brott 2026</p>
        <a class="mode-bar__download mode-bar__download--desktop" href="fruit-sheet.png" download="fruit-sheet.png"
          >source image</a
        >
        <a
          class="mode-bar__download mode-bar__download--mobile"
          href="fruit-sheet.png"
          target="_blank"
          rel="noopener noreferrer"
          >source image</a
        >
      </div>
      <div class="mode-bar__controls-row">
        <div class="mode-bar__toolbar">
          <div class="mode-bar__actions-icons">
            <button type="button" id="reset-fruits" aria-label="Reset to one fruit in the center" title="Reset">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
              </svg>
            </button>
            <button type="button" id="theme-toggle" aria-label="Switch to dark mode" title="Theme">
              <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
              </svg>
              <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="mode-bar__modes">
          <button type="button" data-mode="default" class="is-active">Default</button>
          <button type="button" data-mode="physics">Physics</button>
          <button type="button" data-mode="snake">Snake</button>
          <button type="button" data-mode="orbit">Orbit</button>
          <button type="button" data-mode="rain">Rain</button>
          <button type="button" data-mode="vortex">Vortex</button>
        </div>
      </div>
    </div>
    <div id="gyro-prompt">
      <span class="gyro-prompt__legacy"
        >Tilt to steer in Physics mode <button type="button" id="gyro-enable">Enable motion</button></span
      >
      <div class="gyro-prompt__modern" role="presentation">
        <button type="button" id="gyro-toggle" aria-pressed="false" aria-label="Tilt steering off">
          <img src="motion-tilt-icon.png" alt="" width="24" height="24" decoding="async" />
        </button>
      </div>
    </div>
  </nav>
  <p id="err" hidden></p>

  <script>
(function () {
  var stage = document.getElementById('stage');
  var errEl = document.getElementById('err');
  var starterHint = document.getElementById('starter-hint');
  var modeBar = document.getElementById('mode-bar');
  var gyroPrompt = document.getElementById('gyro-prompt');
  var gyroBtn = document.getElementById('gyro-enable');
  var gyroToggle = document.getElementById('gyro-toggle');
  function syncGyroToggleUi() {
    if (!gyroToggle) return;
    gyroToggle.classList.toggle('is-on', gyroMotionOn);
    gyroToggle.setAttribute('aria-pressed', gyroMotionOn ? 'true' : 'false');
    gyroToggle.setAttribute(
      'aria-label',
      gyroMotionOn ? 'Tilt steering on' : 'Tilt steering off'
    );
    gyroToggle.title = gyroMotionOn ? 'Turn off tilt steering' : 'Turn on tilt steering';
  }
  var resetBtn = document.getElementById('reset-fruits');
  var themeToggle = document.getElementById('theme-toggle');
  var THEME_STORAGE_KEY = 'fruit-stack-theme';

  function getTheme() {
    var t = document.documentElement.getAttribute('data-theme');
    return t === 'dark' ? 'dark' : 'light';
  }

  function applyTheme(next) {
    document.documentElement.setAttribute('data-theme', next);
    try {
      localStorage.setItem(THEME_STORAGE_KEY, next);
    } catch (e) {}
    if (themeToggle) {
      themeToggle.setAttribute(
        'aria-label',
        next === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'
      );
      themeToggle.title = next === 'dark' ? 'Light mode' : 'Dark mode';
    }
  }

  if (themeToggle) {
    applyTheme(getTheme());
    themeToggle.addEventListener('click', function (e) {
      e.stopPropagation();
      applyTheme(getTheme() === 'dark' ? 'light' : 'dark');
    });
  }

  var MODE = {
    DEFAULT: 'default',
    PHYSICS: 'physics',
    SNAKE: 'snake',
    ORBIT: 'orbit',
    RAIN: 'rain',
    VORTEX: 'vortex'
  };

  var urls = [];
  var items = [];
  var z = 1;
  var mode = MODE.DEFAULT;
  var cursorX = window.innerWidth / 2;
  var cursorY = window.innerHeight / 2;
  var lastPx = cursorX;
  var lastPy = cursorY;
  var t0 = performance.now();
  var lastFrame = t0;
  var SPAWN_INTERVAL_MS = 95;
  var holdTimer = null;

  var R = 60;
  /** Max fruit center Y so the sprite bottom sits on the mode bar top (viewport coords). */
  function fruitFloorMaxPy() {
    if (!modeBar) return window.innerHeight - R;
    if (!isMobileFruitScale()) {
      return modeBar.getBoundingClientRect().top - R;
    }
    var top = modeBar.getBoundingClientRect().top;
    if (floorBarTopStable == null) {
      floorBarTopStable = top;
    } else {
      var d = top - floorBarTopStable;
      if (Math.abs(d) >= 2) floorBarTopStable = top;
    }
    return floorBarTopStable - R;
  }
  var grav = { x: 0, y: 0.95 };
  var gyroHandlerAttached = false;
  /** User toggle: when true and listener is active, device tilt sets gravity in Physics mode. */
  var gyroMotionOn = false;
  var physicsGrab = null;
  var physPrevGrabX = 0;
  var physPrevGrabY = 0;
  var physThrowVx = 0;
  var physThrowVy = 0;
  var PHYS_PICK_R = 64;
  var PHYS_THROW_MUL = 1.28;
  var PHYS_FRUIT_RESTITUTION = 0.58;
  var PHYS_COLL_ITERS = 4;
  /** Physics mode fruit cap (desktop unchanged). Mobile cap is tuned separately. */
  var PHYS_MAX_FRUIT_DESKTOP = 150;
  var PHYS_MAX_FRUIT_MOBILE = 70;

  /** Ignore subpixel / chrome UI jitter in mode-bar top (stabilizes physics floor on mobile). */
  var floorBarTopStable = null;

  var snakePoints = [];
  var snakeSmoothX = cursorX;
  var snakeSmoothY = cursorY;
  var SNAKE_SPACING = 52;
  var rainSpawnSeq = 0;
  var RAIN_PHI = 0.618033988749895;
  var DEFAULT_FF_RADIUS = 215;
  var DEFAULT_FF_STRENGTH = 2100;
  var DEFAULT_IN_ZONE_HOME_MUL = 0.18;
  var DEFAULT_OUTSIDE_HOME_BOOST = 1.95;
  var DEFAULT_OUTSIDE_EXTRA_DAMP = 0.904;
  var DEFAULT_HOME_SPRING = 1.12;
  var DEFAULT_HOME_DEAD = 20;
  var DEFAULT_SEP_RADIUS = 62;
  var DEFAULT_SEP_STRENGTH = 410;
  var DEFAULT_CURSOR_MOVE_THRESH = 0.5;
  var DEFAULT_SCATTER_MIN_CELL = 84;
  var DEFAULT_SCATTER_ASPECT_MUL = 2.12;
  var MODE_BLEND_MS = 480;
  var modeBlendT0 = 0;
  var loopPrevCx = cursorX;
  var loopPrevCy = cursorY;
  var VORTEX_SEP_RADIUS = 78;
  var DEFAULT_SPAWN_TRAD_BASE = 38;
  var DEFAULT_SPAWN_TRAD_SPAN = 78;
  var RAIN_JITTER_CAP = 64;
  /** Minimum gap (px) between starter hint bottom and fruit sprite top. */
  var STARTER_HINT_FRUIT_GAP = 32;
  /** Extra room (px) so bob / jitter never brings the fruit into the hint. */
  var LONE_FRUIT_BOB_ALLOW = 14;
  /** Mobile: estimated hero hint height (px) for layout before measure; two lines + padding. */
  var MOBILE_HERO_HINT_EST_HEIGHT = 96;

  function isMobileFruitScale() {
    return typeof window.matchMedia !== 'undefined' && window.matchMedia('(max-width: 640px)').matches;
  }

  function dockGyroPrompt() {
    if (!gyroPrompt || !modeBar) return;
    var toolbar = modeBar.querySelector('.mode-bar__toolbar');
    var icons = modeBar.querySelector('.mode-bar__actions-icons');
    if (!toolbar || !icons) return;
    if (isMobileFruitScale()) {
      if (gyroPrompt.parentNode !== toolbar) {
        toolbar.insertBefore(gyroPrompt, icons);
      }
    } else {
      modeBar.appendChild(gyroPrompt);
    }
  }

  function physMaxFruit() {
    return isMobileFruitScale() ? PHYS_MAX_FRUIT_MOBILE : PHYS_MAX_FRUIT_DESKTOP;
  }

  function syncFruitScaleFromViewport() {
    floorBarTopStable = null;
    var scale;
    if (isMobileFruitScale()) {
      R = 32;
      scale = R / 60;
      PHYS_PICK_R = Math.max(36, Math.round(64 * scale));
      SNAKE_SPACING = Math.max(26, Math.round(52 * scale));
      DEFAULT_FF_RADIUS = Math.round(215 * scale);
      DEFAULT_SEP_RADIUS = Math.max(36, Math.round(62 * scale));
      DEFAULT_SCATTER_MIN_CELL = Math.max(48, Math.round(84 * scale));
      DEFAULT_HOME_DEAD = Math.max(12, Math.round(20 * scale));
      VORTEX_SEP_RADIUS = Math.max(48, Math.round(78 * scale));
      DEFAULT_SPAWN_TRAD_BASE = Math.round(38 * scale);
      DEFAULT_SPAWN_TRAD_SPAN = Math.round(78 * scale);
      RAIN_JITTER_CAP = Math.max(36, Math.round(64 * scale));
      PHYS_COLL_ITERS = 10;
    } else {
      R = 60;
      scale = 1;
      PHYS_PICK_R = 64;
      SNAKE_SPACING = 52;
      DEFAULT_FF_RADIUS = 215;
      DEFAULT_SEP_RADIUS = 62;
      DEFAULT_SCATTER_MIN_CELL = 84;
      DEFAULT_HOME_DEAD = 20;
      VORTEX_SEP_RADIUS = 78;
      DEFAULT_SPAWN_TRAD_BASE = 38;
      DEFAULT_SPAWN_TRAD_SPAN = 78;
      RAIN_JITTER_CAP = 64;
      PHYS_COLL_ITERS = 4;
    }
  }

  /** Vertical center of the playable band (between top margin R and mode-bar floor). */
  function initialFruitCenterPy(viewportH) {
    var floor = fruitFloorMaxPy();
    if (isMobileFruitScale()) {
      return Math.max(R, Math.min(floor, R + (floor - R) * 0.5));
    }
    return Math.min(viewportH / 2, floor);
  }

  function applyStarterViewportCenter() {
    if (!isMobileFruitScale()) return;
    var W0 = window.innerWidth;
    var H0 = window.innerHeight;
    var home = loneFruitPlayHome(W0, H0, fruitFloorMaxPy());
    lastPx = home.cx;
    lastPy = home.cy;
    cursorX = home.cx;
    cursorY = home.cy;
    if (items.length === 1) {
      var lone = items[0];
      lone.bx = home.cx;
      lone.by = home.cy;
      lone.px = home.cx;
      lone.py = home.cy;
      lone.vx = 0;
      lone.vy = 0;
    }
  }

  syncFruitScaleFromViewport();
  dockGyroPrompt();
  window.addEventListener('resize', function () {
    syncFruitScaleFromViewport();
    dockGyroPrompt();
    updateStarterHint();
  });
  if (typeof window.visualViewport !== 'undefined') {
    window.visualViewport.addEventListener('resize', function () {
      floorBarTopStable = null;
      updateStarterHint();
    });
    window.visualViewport.addEventListener('scroll', function () {
      floorBarTopStable = null;
    });
  }

  function pickUrl() {
    return urls[(Math.random() * urls.length) | 0];
  }

  function pickTopPhysicsFruit(cx, cy) {
    var best = null;
    var bestZ = -1;
    for (var qi = 0; qi < items.length; qi++) {
      var qit = items[qi];
      var d = Math.hypot(qit.px - cx, qit.py - cy);
      if (d < PHYS_PICK_R && qit.z > bestZ) {
        bestZ = qit.z;
        best = qit;
      }
    }
    return best;
  }

  function releasePhysicsGrab() {
    if (physicsGrab) {
      physicsGrab.vx = physThrowVx * PHYS_THROW_MUL;
      physicsGrab.vy = physThrowVy * PHYS_THROW_MUL;
      physicsGrab = null;
    }
    physThrowVx = 0;
    physThrowVy = 0;
  }

  function resolvePhysicsFruitCollisions(W, floorMaxPy, grabVx, grabVy) {
    var minD = 2 * R - 0.5;
    var e = PHYS_FRUIT_RESTITUTION;
    var wallB = 0.48;
    for (var iter = 0; iter < PHYS_COLL_ITERS; iter++) {
      for (var ci = 0; ci < items.length; ci++) {
        for (var cj = ci + 1; cj < items.length; cj++) {
          var a = items[ci];
          var b = items[cj];
          var ag = physicsGrab === a;
          var bg = physicsGrab === b;
          if (ag && bg) continue;
          var dx = b.px - a.px;
          var dy = b.py - a.py;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 1e-4) {
            dist = 1e-4;
            dx = 1;
            dy = 0;
          }
          if (dist >= minD) continue;
          var nx = dx / dist;
          var ny = dy / dist;
          var overlap = minD - dist;
          if (ag && !bg) {
            b.px += nx * overlap;
            b.py += ny * overlap;
            var rvx = b.vx - grabVx;
            var rvy = b.vy - grabVy;
            var vn = rvx * nx + rvy * ny;
            if (vn < 0) {
              var imp = -(1 + e) * vn;
              b.vx += imp * nx;
              b.vy += imp * ny;
            }
          } else if (bg && !ag) {
            a.px -= nx * overlap;
            a.py -= ny * overlap;
            rvx = a.vx - grabVx;
            rvy = a.vy - grabVy;
            vn = rvx * nx + rvy * ny;
            if (vn > 0) {
              var impA = (1 + e) * vn;
              a.vx -= impA * nx;
              a.vy -= impA * ny;
            }
          } else {
            var corr = overlap * 0.5;
            a.px -= nx * corr;
            a.py -= ny * corr;
            b.px += nx * corr;
            b.py += ny * corr;
            vn = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
            if (vn > 0) {
              var imp2 = ((1 + e) * vn) / 2;
              a.vx -= imp2 * nx;
              a.vy -= imp2 * ny;
              b.vx += imp2 * nx;
              b.vy += imp2 * ny;
            }
          }
        }
      }
    }
    for (var ck = 0; ck < items.length; ck++) {
      var cit = items[ck];
      if (physicsGrab === cit) {
        cit.px = Math.max(R, Math.min(W - R, cursorX));
        cit.py = Math.max(R, Math.min(floorMaxPy, cursorY));
        continue;
      }
      if (cit.px < R) {
        cit.px = R;
        cit.vx *= -wallB;
      }
      if (cit.px > W - R) {
        cit.px = W - R;
        cit.vx *= -wallB;
      }
      if (cit.py < R) {
        cit.py = R;
        cit.vy *= -wallB;
      }
      if (cit.py > floorMaxPy) {
        cit.py = floorMaxPy;
        cit.vy *= -wallB;
      }
    }
  }

  function starterHintBottomPx() {
    if (!starterHint) return 48 + R;
    if (!starterHint.hidden) {
      return starterHint.getBoundingClientRect().bottom;
    }
    starterHint.hidden = false;
    starterHint.style.visibility = 'hidden';
    var bottom = starterHint.getBoundingClientRect().bottom;
    starterHint.style.visibility = '';
    starterHint.hidden = true;
    return bottom;
  }

  function viewportSafeTopPx() {
    var t = 12;
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport.offsetTop > 0) {
      t = Math.max(t, window.visualViewport.offsetTop);
    }
    return t;
  }

  function loneFruitDriftRadius() {
    return Math.max(18, Math.round(R * 0.34));
  }

  /**
   * Mobile: fruit center is the midpoint of the vertical play band (safe top + hint reserve → mode-bar floor).
   * Hint is placed in JS just above that spawn point — no circular layout with getBoundingClientRect.
   */
  function loneFruitPlayHomeMobile(W, H, floorY) {
    var cx = W * 0.5;
    var safeTop = viewportSafeTopPx();
    var minCy =
      safeTop +
      MOBILE_HERO_HINT_EST_HEIGHT +
      STARTER_HINT_FRUIT_GAP +
      R +
      LONE_FRUIT_BOB_ALLOW;
    var maxCy = floorY;
    var cy = (minCy + maxCy) * 0.5;
    if (minCy > maxCy - 2) {
      cy = Math.min(maxCy, Math.max(R, (minCy + maxCy) * 0.5));
    }
    return { cx: cx, cy: cy, minCy: minCy, maxCy: maxCy };
  }

  /** Fixed play “home” for the lone fruit: viewport-centered X; Y from hint (desktop) or play band (mobile). */
  function loneFruitPlayHome(W, H, floorY) {
    if (isMobileFruitScale()) {
      return loneFruitPlayHomeMobile(W, H, floorY);
    }
    var cx = W * 0.5;
    var hintBottom = starterHintBottomPx();
    var minCy = hintBottom + STARTER_HINT_FRUIT_GAP + R + LONE_FRUIT_BOB_ALLOW;
    var maxCy = floorY;
    var screenCy = H * 0.5;
    var cy = Math.max(minCy, Math.min(maxCy, screenCy));
    if (minCy > maxCy - 2) {
      cy = Math.min(maxCy, Math.max(R, (minCy + maxCy) * 0.5));
    }
    return { cx: cx, cy: cy, minCy: minCy, maxCy: maxCy };
  }

  function updateStarterHint() {
    if (!starterHint) return;
    if (items.length !== 1) {
      starterHint.hidden = true;
      if (isMobileFruitScale()) {
        starterHint.style.left = '';
        starterHint.style.top = '';
        starterHint.style.transform = '';
      }
      return;
    }
    starterHint.hidden = false;
    if (isMobileFruitScale()) {
      var W = window.innerWidth;
      var H = window.innerHeight;
      var floorY = fruitFloorMaxPy();
      var home = loneFruitPlayHome(W, H, floorY);
      var anchorY = home.cy - R - STARTER_HINT_FRUIT_GAP;
      starterHint.style.left = home.cx + 'px';
      starterHint.style.top = anchorY + 'px';
      starterHint.style.transform = 'translate(-50%, -100%)';
    } else {
      starterHint.style.left = '';
      starterHint.style.top = '';
      starterHint.style.transform = '';
    }
  }

  function ensureSim(it, x, y) {
    if (it.px == null) it.px = x;
    if (it.py == null) it.py = y;
    if (it.vx == null) it.vx = (Math.random() - 0.5) * 160;
    if (it.vy == null) it.vy = (Math.random() - 0.5) * 160;
  }

  /** Spawn above the viewport with downward velocity; low-discrepancy X so drops aren't clumped. */
  function rainSpawnFromAbove(it, W, H, extraHigh) {
    var spread = extraHigh == null ? 0 : extraHigh;
    rainSpawnSeq++;
    var u = (rainSpawnSeq * RAIN_PHI) % 1;
    var v = (rainSpawnSeq * 0.4142135623730951) % 1;
    var w = (rainSpawnSeq * 0.7548776662466927) % 1;
    if (u < 0) u += 1;
    if (v < 0) v += 1;
    if (w < 0) w += 1;
    var jitterX = (Math.random() - 0.5) * Math.min(RAIN_JITTER_CAP, W * 0.065);
    it.px = Math.max(R, Math.min(W - R, u * W + jitterX));
    it.py = -R - 32 - v * 130 - w * 85 - spread;
    it.vy = 300 + w * 440 + (Math.random() - 0.5) * 70;
    it.vx = (Math.random() - 0.5) * 48 + (u - 0.5) * 22;
  }

  function addFruit(clientX, clientY) {
    var x = clientX;
    var y = clientY;
    var H0 = window.innerHeight;
    var W0 = window.innerWidth;
    if (mode === MODE.RAIN) {
      x = Math.random() * W0;
      y = -50 - Math.random() * 80;
    } else if (items.length === 0) {
      var hSpawn = loneFruitPlayHome(W0, H0, fruitFloorMaxPy());
      x = hSpawn.cx;
      y = hSpawn.cy;
    }

    var img = document.createElement('img');
    img.className = 'fruit';
    img.src = pickUrl();
    img.alt = '';
    img.draggable = false;
    stage.appendChild(img);

    var depth = 0.35 + Math.random() * 0.65;
    var phase = Math.random() * Math.PI * 2;
    var spin = (Math.random() - 0.5) * 0.04;

    var it = {
      el: img,
      bx: x,
      by: y,
      depth: depth,
      phase: phase,
      spin: spin,
      z: z++
    };
    ensureSim(it, x, y);
    if (mode === MODE.RAIN) {
      rainSpawnFromAbove(it, W0, H0, 0);
      it.rainExitPhase = false;
    } else if (mode === MODE.DEFAULT) {
      var floor0 = fruitFloorMaxPy();
      if (items.length === 0) {
        it.bx = x;
        it.by = y;
        it.px = x + (Math.random() - 0.5) * 8;
        it.py = y + (Math.random() - 0.5) * 8;
        it.vx = (Math.random() - 0.5) * 85;
        it.vy = (Math.random() - 0.5) * 85;
      } else {
        var tAng = Math.random() * Math.PI * 2;
        var tRad = DEFAULT_SPAWN_TRAD_BASE + Math.random() * DEFAULT_SPAWN_TRAD_SPAN;
        it.bx = Math.max(R, Math.min(W0 - R, clientX + Math.cos(tAng) * tRad));
        it.by = Math.max(R, Math.min(floor0, clientY + Math.sin(tAng) * tRad));
        it.px = Math.max(R, Math.min(W0 - R, clientX + (Math.random() - 0.5) * 32));
        it.py = Math.max(R, Math.min(floor0, clientY + (Math.random() - 0.5) * 32));
        it.vx = (Math.random() - 0.5) * 110;
        it.vy = (Math.random() - 0.5) * 110;
      }
    }

    items.push(it);
    img.style.zIndex = String(it.z);
    trimPhysicsFruitCount();
    if (items.length === 1) {
      updateStarterHint();
    }
  }

  function pathLengthFromHead(pts) {
    var L = 0;
    for (var i = 0; i < pts.length - 1; i++) {
      var dx = pts[i].x - pts[i + 1].x;
      var dy = pts[i].y - pts[i + 1].y;
      L += Math.sqrt(dx * dx + dy * dy);
    }
    return L;
  }

  function pointOnSnake(distFromHead) {
    var pts = snakePoints;
    if (!pts.length) return { x: snakeSmoothX, y: snakeSmoothY };
    if (pts.length === 1) return { x: pts[0].x, y: pts[0].y };
    var acc = 0;
    for (var i = 0; i < pts.length - 1; i++) {
      var a = pts[i];
      var b = pts[i + 1];
      var dx = b.x - a.x;
      var dy = b.y - a.y;
      var seg = Math.sqrt(dx * dx + dy * dy) || 0.001;
      if (acc + seg >= distFromHead) {
        var t = (distFromHead - acc) / seg;
        return { x: a.x + dx * t, y: a.y + dy * t };
      }
      acc += seg;
    }
    return { x: pts[pts.length - 1].x, y: pts[pts.length - 1].y };
  }

  function resetFruitsToOne() {
    stopHoldSpawn();
    if (physicsGrab) {
      physicsGrab = null;
      physThrowVx = 0;
      physThrowVy = 0;
    }
    items.forEach(function (it) {
      if (it.el && it.el.parentNode) it.el.remove();
    });
    items.length = 0;
    modeBlendT0 = 0;
    var W0 = window.innerWidth;
    var H0 = window.innerHeight;
    var homeR = loneFruitPlayHome(W0, H0, fruitFloorMaxPy());
    lastPx = homeR.cx;
    lastPy = homeR.cy;
    cursorX = homeR.cx;
    cursorY = homeR.cy;
    addFruit(homeR.cx, homeR.cy);
    var lone = items[0];
    if (lone) {
      lone.bx = homeR.cx;
      lone.by = homeR.cy;
      lone.px = homeR.cx;
      lone.py = homeR.cy;
      lone.vx = 0;
      lone.vy = 0;
      lone.rainExitPhase = false;
    }
    if (mode === MODE.SNAKE) {
      snakePoints = [{ x: cursorX, y: cursorY }];
      snakeSmoothX = cursorX;
      snakeSmoothY = cursorY;
    }
  }

  function trimPhysicsFruitCount() {
    if (mode !== MODE.PHYSICS) return;
    while (items.length > physMaxFruit()) {
      var victim = items.shift();
      if (physicsGrab === victim) {
        physicsGrab = null;
        physThrowVx = 0;
        physThrowVy = 0;
      }
      if (victim && victim.el && victim.el.parentNode) victim.el.remove();
    }
  }

  function updateSnakePath() {
    snakeSmoothX += (cursorX - snakeSmoothX) * 0.22;
    snakeSmoothY += (cursorY - snakeSmoothY) * 0.22;
    var head = snakePoints[0];
    if (!head || Math.hypot(head.x - snakeSmoothX, head.y - snakeSmoothY) > 3) {
      snakePoints.unshift({ x: snakeSmoothX, y: snakeSmoothY });
    } else {
      snakePoints[0] = { x: snakeSmoothX, y: snakeSmoothY };
    }
    var need = items.length * SNAKE_SPACING + 400;
    while (pathLengthFromHead(snakePoints) > need && snakePoints.length > 3) {
      snakePoints.pop();
    }
  }

  function setMode(next) {
    var prev = mode;
    if (prev === MODE.PHYSICS && physicsGrab) releasePhysicsGrab();
    if (next !== prev && items.length > 0 && next !== MODE.RAIN) {
      modeBlendT0 = performance.now();
      items.forEach(function (it) {
        var ox =
          it._drawX != null && it._drawX === it._drawX ? it._drawX : it.px != null ? it.px : it.bx;
        var oy =
          it._drawY != null && it._drawY === it._drawY ? it._drawY : it.py != null ? it.py : it.by;
        it._blendX0 = ox;
        it._blendY0 = oy;
      });
    }
    mode = next;
    modeBar.querySelectorAll('button[data-mode]').forEach(function (b) {
      b.classList.toggle('is-active', b.getAttribute('data-mode') === mode);
    });
    if (gyroPrompt) {
      if (isMobileFruitScale()) {
        gyroPrompt.classList.toggle(
          'is-visible',
          mode === MODE.PHYSICS && typeof DeviceOrientationEvent !== 'undefined'
        );
        if (gyroToggle && mode === MODE.PHYSICS) {
          syncGyroToggleUi();
        }
      } else {
        gyroPrompt.classList.toggle(
          'is-visible',
          mode === MODE.PHYSICS &&
            typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function' &&
            !gyroHandlerAttached
        );
      }
    }

    if (mode === MODE.SNAKE) {
      if (items.length === 1) {
        var Ws = window.innerWidth;
        var Hs = window.innerHeight;
        var sh = loneFruitPlayHome(Ws, Hs, fruitFloorMaxPy());
        cursorX = sh.cx;
        cursorY = sh.cy;
        lastPx = sh.cx;
        lastPy = sh.cy;
      }
      snakePoints = [{ x: cursorX, y: cursorY }];
      snakeSmoothX = cursorX;
      snakeSmoothY = cursorY;
    }
    if (mode === MODE.ORBIT) {
      var Wo = window.innerWidth;
      var Ho = window.innerHeight;
      var ocx = Wo * 0.5;
      var ocy;
      if (items.length === 1) {
        var oh = loneFruitPlayHome(Wo, Ho, fruitFloorMaxPy());
        ocy = oh.cy;
      } else if (isMobileFruitScale()) {
        ocy = initialFruitCenterPy(Ho);
      } else {
        ocy = Math.min(Ho * 0.5, fruitFloorMaxPy());
      }
      cursorX = ocx;
      cursorY = ocy;
      lastPx = ocx;
      lastPy = ocy;
      loopPrevCx = ocx;
      loopPrevCy = ocy;
    }
    if (mode === MODE.PHYSICS) {
      trimPhysicsFruitCount();
    }
    if (mode === MODE.RAIN) {
      var Rw = window.innerWidth;
      var Rh = window.innerHeight;
      var nRain = items.length;
      rainSpawnSeq = nRain + 64;
      items.forEach(function (it) {
        var sx =
          it._drawX != null && it._drawX === it._drawX ? it._drawX : it.px != null ? it.px : it.bx;
        var sy =
          it._drawY != null && it._drawY === it._drawY ? it._drawY : it.py != null ? it.py : it.by;
        it.px = Math.max(R, Math.min(Rw - R, sx));
        it.py = sy;
        it.vx = (Math.random() - 0.5) * 115;
        it.vy = 300 + Math.random() * 360;
        it.rainExitPhase = true;
        it.bx = it.px;
        it.by = Math.max(-600, Math.min(Rh + 120, it.py));
      });
    }
    if (mode === MODE.DEFAULT && prev !== MODE.DEFAULT) {
      var Wd = window.innerWidth;
      var floorDef = fruitFloorMaxPy();
      var nDef = items.length;
      var spanX = Math.max(80, Wd - 2 * R);
      var spanY = Math.max(80, floorDef - R);
      var aspect = spanX / Math.max(1, spanY);
      var colsW = Math.max(1, Math.floor(spanX / DEFAULT_SCATTER_MIN_CELL));
      var colsA = Math.round(Math.sqrt(nDef * Math.max(0.82, aspect) * DEFAULT_SCATTER_ASPECT_MUL));
      var cols = Math.min(nDef, Math.max(nDef <= 3 ? 1 : 4, colsW, colsA));
      if (nDef <= 1) cols = 1;
      var rows = Math.ceil(nDef / cols) || 1;
      var slots = new Array(nDef);
      for (var si = 0; si < nDef; si++) slots[si] = si;
      for (var sj = nDef - 1; sj > 0; sj--) {
        var sk = (Math.random() * (sj + 1)) | 0;
        var tmp = slots[sj];
        slots[sj] = slots[sk];
        slots[sk] = tmp;
      }
      items.forEach(function (it, idx) {
        var slot = slots[idx];
        var col = slot % cols;
        var row = (slot / cols) | 0;
        col = (col + row * 2) % cols;
        var xCell = (col + 0.14 + Math.random() * 0.72) / cols;
        var yCell = (row + 0.14 + Math.random() * 0.72) / rows;
        it.bx = R + xCell * spanX;
        it.by = R + yCell * spanY;
        it.px = Math.max(R, Math.min(Wd - R, it.bx + (Math.random() - 0.5) * 36));
        it.py = Math.max(R, Math.min(floorDef, it.by + (Math.random() - 0.5) * 36));
        it.vx = (Math.random() - 0.5) * 125;
        it.vy = (Math.random() - 0.5) * 125;
      });
    }
    items.forEach(function (it) {
      ensureSim(it, it.bx, it.by);
    });
  }

  function attachGyro() {
    if (gyroHandlerAttached) return;
    window.addEventListener(
      'deviceorientation',
      function (e) {
        if (mode !== MODE.PHYSICS) return;
        if (isMobileFruitScale() && !gyroMotionOn) return;
        var g = e.gamma;
        var b = e.beta;
        if (g == null || b == null) return;
        if (isMobileFruitScale()) {
          var GAMMA_DIV = 36;
          /* Phone flat on a table, screen up: beta ≈ 90° (W3C device orientation). */
          var BETA_NEUTRAL = 90;
          var BETA_DIV = 48;
          var CAP = 1.05;
          var rawGx = g / GAMMA_DIV;
          var rawGy = (b - BETA_NEUTRAL) / BETA_DIV;
          var ax = Math.abs(rawGx);
          var ay = Math.abs(rawGy);
          var softGx = Math.sign(rawGx) * Math.pow(ax, 0.95);
          var expY = rawGy >= 0 ? 0.82 : 1.32;
          var softGy = Math.sign(rawGy) * Math.pow(ay, expY);
          if (softGy > 0) softGy *= 1.12;
          else if (softGy < 0) softGy *= 0.88;
          grav.x = Math.max(-CAP, Math.min(CAP, softGx));
          /* Flip β→gravity Y (screen Z) so tilt matches on-device expectation. */
          grav.y = Math.max(-CAP, Math.min(CAP, -softGy));
        } else {
          grav.x = Math.max(-1.2, Math.min(1.2, g / 25));
          grav.y = Math.max(-1.2, Math.min(1.2, (b - 50) / 25));
        }
      },
      true
    );
    gyroHandlerAttached = true;
    if (!isMobileFruitScale() && gyroPrompt) {
      gyroPrompt.classList.remove('is-visible');
    }
  }

  if (gyroBtn) {
    gyroBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
        DeviceOrientationEvent.requestPermission()
          .then(function (s) {
            if (s === 'granted') attachGyro();
          })
          .catch(function () {});
      } else {
        attachGyro();
      }
    });
  }

  if (gyroToggle) {
    gyroToggle.addEventListener('click', function (e) {
      e.stopPropagation();
      if (gyroMotionOn) {
        gyroMotionOn = false;
        syncGyroToggleUi();
        return;
      }
      gyroMotionOn = true;
      syncGyroToggleUi();
      if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
        DeviceOrientationEvent.requestPermission()
          .then(function (s) {
            if (s === 'granted') {
              attachGyro();
            } else {
              gyroMotionOn = false;
              syncGyroToggleUi();
            }
          })
          .catch(function () {
            gyroMotionOn = false;
            syncGyroToggleUi();
          });
      } else {
        attachGyro();
      }
    });
  }

  modeBar.querySelectorAll('button[data-mode]').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var m = btn.getAttribute('data-mode');
      if (m) setMode(m);
    });
  });

  if (resetBtn) {
    resetBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      resetFruitsToOne();
    });
  }

  function loop(now) {
    var dt = Math.min(0.055, (now - lastFrame) / 1000);
    lastFrame = now;
    var t = (now - t0) * 0.001;
    var W = window.innerWidth;
    var H = window.innerHeight;
    var floorY = fruitFloorMaxPy();

    if (
      items.length === 1 &&
      mode !== MODE.RAIN &&
      !(isMobileFruitScale() && mode === MODE.PHYSICS && gyroMotionOn)
    ) {
      var homeLoop = loneFruitPlayHome(W, H, floorY);
      cursorX = homeLoop.cx;
      cursorY = homeLoop.cy;
      lastPx = homeLoop.cx;
      lastPy = homeLoop.cy;
      items[0].bx = homeLoop.cx;
      items[0].by = homeLoop.cy;
    }

    var cursorMove = Math.hypot(cursorX - loopPrevCx, cursorY - loopPrevCy);

    var physCollGrabSnapX = physPrevGrabX;
    var physCollGrabSnapY = physPrevGrabY;

    var blendW = 1;
    if (modeBlendT0 > 0) {
      var blendElapsed = now - modeBlendT0;
      blendW = Math.min(1, blendElapsed / MODE_BLEND_MS);
      blendW = blendW * blendW * (3 - 2 * blendW);
      if (blendElapsed >= MODE_BLEND_MS) modeBlendT0 = 0;
    }

    if (mode === MODE.SNAKE) updateSnakePath();

    var RAIN_GRAVITY = 2200;

    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var d = it.depth;
      var x, y, rot;

      if (mode === MODE.DEFAULT) {
        ensureSim(it, it.bx, it.by);
        var fdx = it.px - cursorX;
        var fdy = it.py - cursorY;
        var fdist = Math.sqrt(fdx * fdx + fdy * fdy) + 0.001;
        var inPushZone =
          cursorMove > DEFAULT_CURSOR_MOVE_THRESH && fdist < DEFAULT_FF_RADIUS;
        if (inPushZone) {
          var ff = Math.max(0, 1 - fdist / DEFAULT_FF_RADIUS);
          ff = Math.pow(ff, 2.25);
          var push = DEFAULT_FF_STRENGTH * ff;
          var mv = cursorMove + 0.001;
          var mx = (cursorX - loopPrevCx) / mv;
          var my = (cursorY - loopPrevCy) / mv;
          var rdx = fdx / fdist;
          var rdy = fdy / fdist;
          var inline = Math.abs(mx * rdx + my * rdy);
          var pathway = 0.52 + 0.48 * inline * inline;
          push *= pathway;
          it.vx += rdx * push * dt;
          it.vy += rdy * push * dt;
        }
        var sepX = 0;
        var sepY = 0;
        var sepR = DEFAULT_SEP_RADIUS;
        for (var sj = 0; sj < items.length; sj++) {
          if (sj === i) continue;
          var so = items[sj];
          var sdx = it.px - so.px;
          var sdy = it.py - so.py;
          var sd = Math.sqrt(sdx * sdx + sdy * sdy) + 0.001;
          if (sd < sepR) {
            var sq = Math.pow(1 - sd / sepR, 1.55);
            var sf = sq * DEFAULT_SEP_STRENGTH;
            sepX += (sdx / sd) * sf;
            sepY += (sdy / sd) * sf;
          }
        }
        it.vx += sepX * dt;
        it.vy += sepY * dt;
        var hx = it.bx - it.px;
        var hy = it.by - it.py;
        var hdist = Math.sqrt(hx * hx + hy * hy);
        var localHomeMul = inPushZone ? DEFAULT_IN_ZONE_HOME_MUL : 1;
        var homeK = DEFAULT_HOME_SPRING * localHomeMul;
        if (!inPushZone) homeK *= DEFAULT_OUTSIDE_HOME_BOOST;
        if (hdist < DEFAULT_HOME_DEAD) homeK *= hdist / DEFAULT_HOME_DEAD;
        if (hdist > 0.02) {
          var cap = Math.min(hdist, inPushZone ? 88 : 118);
          it.vx += (hx / hdist) * cap * homeK * dt;
          it.vy += (hy / hdist) * cap * homeK * dt;
        }
        var baseDamp = 0.935;
        if (!inPushZone) baseDamp *= DEFAULT_OUTSIDE_EXTRA_DAMP;
        it.vx *= Math.pow(baseDamp, dt * 60);
        it.vy *= Math.pow(baseDamp, dt * 60);
        it.px += it.vx * dt;
        it.py += it.vy * dt;
        var defBounce = 0.42;
        if (it.px < R) {
          it.px = R;
          it.vx *= -defBounce;
        }
        if (it.px > W - R) {
          it.px = W - R;
          it.vx *= -defBounce;
        }
        if (it.py < R) {
          it.py = R;
          it.vy *= -defBounce;
        }
        if (it.py > floorY) {
          it.py = floorY;
          it.vy *= -defBounce;
        }
        var bobX = Math.sin(t * 0.9 + it.phase) * (5 + 4 * d);
        var bobY = Math.cos(t * 0.75 + it.phase * 1.3) * (4 + 3 * d);
        x = it.px + bobX;
        y = Math.min(it.py + bobY, floorY);
        rot = it.spin * t * 57.3;
      } else if (mode === MODE.PHYSICS) {
        if (physicsGrab === it) {
          var dgx = cursorX - physPrevGrabX;
          var dgy = cursorY - physPrevGrabY;
          var instVx = dgx / Math.max(1e-4, dt);
          var instVy = dgy / Math.max(1e-4, dt);
          physThrowVx = physThrowVx * 0.78 + instVx * 0.22;
          physThrowVy = physThrowVy * 0.78 + instVy * 0.22;
          physPrevGrabX = cursorX;
          physPrevGrabY = cursorY;
          it.px = Math.max(R, Math.min(W - R, cursorX));
          it.py = Math.max(R, Math.min(floorY, cursorY));
          it.vx = 0;
          it.vy = 0;
        } else {
          if (isMobileFruitScale()) {
            if (!gyroMotionOn || !gyroHandlerAttached) {
              grav.x *= 0.96;
              grav.y = grav.y * 0.96 + 0.95 * 0.06;
            }
          } else {
            if (!gyroHandlerAttached) {
              grav.x *= 0.96;
              grav.y = grav.y * 0.96 + 0.95 * 0.06;
            }
          }
          var gx = grav.x * 1180;
          var gy = grav.y * 1180;
          it.vx += gx * dt;
          it.vy += gy * dt;
          it.vx *= Math.pow(0.994, dt * 60);
          it.vy *= Math.pow(0.994, dt * 60);
          it.px += it.vx * dt;
          it.py += it.vy * dt;
          var physBounce = 0.48;
          if (it.px < R) {
            it.px = R;
            it.vx *= -physBounce;
          }
          if (it.px > W - R) {
            it.px = W - R;
            it.vx *= -physBounce;
          }
          if (it.py < R) {
            it.py = R;
            it.vy *= -physBounce;
          }
          if (it.py > floorY) {
            it.py = floorY;
            it.vy *= -physBounce;
          }
        }
        x = it.px;
        y = it.py;
        rot = it.spin * t * 57.3 + Math.atan2(it.vy, it.vx + 0.001) * (180 / Math.PI) * 0.25;
      } else if (mode === MODE.SNAKE) {
        var dist = (items.length - 1 - i) * SNAKE_SPACING;
        var p = pointOnSnake(dist);
        x = p.x + Math.sin(t * 1.2 + it.phase) * 2;
        y = Math.min(p.y + Math.cos(t * 1.1 + it.phase) * 2, floorY);
        rot = it.spin * t * 57.3;
        var p2 = pointOnSnake(dist + 8);
        rot += Math.atan2(p2.y - p.y, p2.x - p.x + 0.001) * (180 / Math.PI);
      } else if (mode === MODE.ORBIT) {
        var n = items.length;
        // Same outer envelope as before, but radii fill from center so there is no hollow core.
        var ringGrow = 20 + Math.sqrt(Math.max(1, n)) * 4.5 + Math.min(72, n * 0.42);
        var maxLayers = n > 0 ? ((n - 1) / 12) | 0 : 0;
        var rMax = ringGrow + 11 * 6.5 + maxLayers * 4.5;
        var rMin = 3;
        if (isMobileFruitScale()) {
          var rMaxRaw = rMax;
          var orbitM = 8;
          var orbitCap = Math.min(
            cursorX - R - orbitM,
            W - R - cursorX - orbitM,
            cursorY - R - orbitM,
            floorY - cursorY - orbitM
          );
          rMax = Math.max(rMin, Math.min(rMaxRaw, orbitCap));
        }
        var ang = t * 1.1 + i * 0.62;
        var rad =
          n <= 1 ? rMin : rMin + (rMax - rMin) * Math.sqrt(i / (n - 1));
        x = cursorX + Math.cos(ang) * rad;
        if (isMobileFruitScale()) {
          y = Math.max(R, Math.min(floorY, cursorY + Math.sin(ang) * rad));
        } else {
          y = Math.min(cursorY + Math.sin(ang) * rad, floorY);
        }
        rot = ang * (180 / Math.PI) + 90;
      } else if (mode === MODE.RAIN) {
        it.vy += RAIN_GRAVITY * dt;
        it.px += it.vx * dt + Math.sin(t * 1.85 + it.phase) * 0.22;
        it.py += it.vy * dt;
        /* No mode-bar floor in rain: drops pass through the nav and respawn from above. */
        if (it.py > H + R + 60) {
          rainSpawnFromAbove(it, W, H, 0);
          it.rainExitPhase = false;
        }
        x = it.px;
        y = it.py;
        rot = it.spin * t * 57.3;
      } else if (mode === MODE.VORTEX) {
        var sepX = 0;
        var sepY = 0;
        var sepR = VORTEX_SEP_RADIUS;
        for (var j = 0; j < items.length; j++) {
          if (j === i) continue;
          var o = items[j];
          var sdx = it.px - o.px;
          var sdy = it.py - o.py;
          var sd = Math.sqrt(sdx * sdx + sdy * sdy) + 0.001;
          if (sd < sepR) {
            var push = Math.pow(1 - sd / sepR, 2) * 130;
            sepX += (sdx / sd) * push;
            sepY += (sdy / sd) * push;
          }
        }
        var dx = cursorX - it.px;
        var dy = cursorY - it.py;
        var dist = Math.sqrt(dx * dx + dy * dy) + 0.001;
        // Stronger pull + swirl keeps motion in a tight spiral so the vortex reads clearly.
        var pull = 207.5 * dt;
        var swirl = 167.5 * dt;
        it.vx += sepX * dt;
        it.vy += sepY * dt;
        it.vx += (dx / dist) * pull + (-dy / dist) * swirl;
        it.vy += (dy / dist) * pull + (dx / dist) * swirl;
        it.vx += (Math.sin(t * 1.7 + i) * 14 + Math.cos(t * 1.1 + it.phase) * 9) * dt;
        it.vy += (Math.cos(t * 1.5 + i) * 14 + Math.sin(t * 0.9 + it.phase) * 9) * dt;
        it.vx *= 0.982;
        it.vy *= 0.982;
        it.px += it.vx * dt * 22.5;
        it.py += it.vy * dt * 22.5;
        if (it.px < R) {
          it.px = R;
          it.vx *= -0.45;
        }
        if (it.px > W - R) {
          it.px = W - R;
          it.vx *= -0.45;
        }
        if (it.py < R) {
          it.py = R;
          it.vy *= -0.45;
        }
        if (it.py > floorY) {
          it.py = floorY;
          it.vy *= -0.45;
        }
        x = it.px;
        y = it.py;
        rot = Math.atan2(it.vy, it.vx) * (180 / Math.PI);
      } else {
        x = it.bx;
        y = it.by;
        rot = 0;
      }

      if (blendW < 1) {
        var tx = x;
        var ty = y;
        x = it._blendX0 + (tx - it._blendX0) * blendW;
        y = it._blendY0 + (ty - it._blendY0) * blendW;
        if (mode === MODE.DEFAULT) {
          var syncBobX = Math.sin(t * 0.9 + it.phase) * (5 + 4 * d);
          var syncBobY = Math.cos(t * 0.75 + it.phase * 1.3) * (4 + 3 * d);
          y = Math.min(y, floorY);
          it.px = x - syncBobX;
          it.py = y - syncBobY;
        } else if (mode === MODE.PHYSICS || mode === MODE.RAIN || mode === MODE.VORTEX) {
          it.px = x;
          it.py = y;
        }
      }

      if (
        items.length === 1 &&
        mode !== MODE.RAIN &&
        !(mode === MODE.PHYSICS && physicsGrab === it) &&
        !(isMobileFruitScale() && mode === MODE.PHYSICS && gyroMotionOn)
      ) {
        var lh = loneFruitPlayHome(W, H, floorY);
        var driftR = loneFruitDriftRadius();
        x = Math.max(lh.cx - driftR, Math.min(lh.cx + driftR, x));
        x = Math.max(R, Math.min(W - R, x));
        y = Math.max(lh.minCy, Math.min(floorY, y));
        if (mode === MODE.DEFAULT) {
          var cBobX = Math.sin(t * 0.9 + it.phase) * (5 + 4 * d);
          var cBobY = Math.cos(t * 0.75 + it.phase * 1.3) * (4 + 3 * d);
          it.px = x - cBobX;
          it.py = Math.min(y - cBobY, floorY);
        } else if (mode === MODE.PHYSICS || mode === MODE.VORTEX) {
          it.px = x;
          it.py = y;
        }
      }

      it.el.style.transform =
        'translate(-50%, -50%) translate(' + x + 'px,' + y + 'px) rotate(' + rot + 'deg)';
      it._drawX = x;
      it._drawY = y;
    }

    if (mode === MODE.PHYSICS) {
      var collGvx = physicsGrab
        ? (cursorX - physCollGrabSnapX) / Math.max(1e-4, dt)
        : 0;
      var collGvy = physicsGrab
        ? (cursorY - physCollGrabSnapY) / Math.max(1e-4, dt)
        : 0;
      resolvePhysicsFruitCollisions(W, floorY, collGvx, collGvy);
    }

    updateStarterHint();

    loopPrevCx = cursorX;
    loopPrevCy = cursorY;

    requestAnimationFrame(loop);
  }

  function onMove(e) {
    var px = e.clientX;
    var py = e.clientY;
    if (e.touches && e.touches[0]) {
      px = e.touches[0].clientX;
      py = e.touches[0].clientY;
    }
    cursorX = px;
    cursorY = py;
    if (e.buttons & 1) {
      lastPx = px;
      lastPy = py;
    }
  }

  function stopHoldSpawn() {
    if (holdTimer !== null) {
      clearInterval(holdTimer);
      holdTimer = null;
    }
  }

  function startHoldSpawn() {
    stopHoldSpawn();
    addFruit(lastPx, lastPy);
    holdTimer = window.setInterval(function () {
      addFruit(lastPx, lastPy);
    }, SPAWN_INTERVAL_MS);
  }

  window.addEventListener('pointermove', onMove, { passive: true });

  document.addEventListener(
    'pointerdown',
    function (e) {
      if (e.button !== 0) return;
      if (e.target.closest('#mode-bar')) return;
      lastPx = e.clientX;
      lastPy = e.clientY;
      if (mode === MODE.PHYSICS) {
        var hit = pickTopPhysicsFruit(lastPx, lastPy);
        if (hit) {
          stopHoldSpawn();
          if (physicsGrab && physicsGrab !== hit) {
            physicsGrab.vx = physThrowVx * PHYS_THROW_MUL;
            physicsGrab.vy = physThrowVy * PHYS_THROW_MUL;
          }
          physicsGrab = hit;
          physPrevGrabX = lastPx;
          physPrevGrabY = lastPy;
          physThrowVx = 0;
          physThrowVy = 0;
          cursorX = lastPx;
          cursorY = lastPy;
          hit.px = Math.max(R, Math.min(window.innerWidth - R, lastPx));
          hit.py = Math.max(R, Math.min(fruitFloorMaxPy(), lastPy));
          z++;
          hit.z = z;
          hit.el.style.zIndex = String(hit.z);
          return;
        }
      }
      startHoldSpawn();
    },
    true
  );

  document.addEventListener('pointerup', function (e) {
    if (e.button !== 0) return;
    if (mode === MODE.PHYSICS) releasePhysicsGrab();
    stopHoldSpawn();
  });
  document.addEventListener('pointercancel', function () {
    if (mode === MODE.PHYSICS) releasePhysicsGrab();
    stopHoldSpawn();
  });
  window.addEventListener('blur', function () {
    if (mode === MODE.PHYSICS) releasePhysicsGrab();
    stopHoldSpawn();
  });

  function loadManifest(url) {
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('bad');
      return r.json();
    });
  }

  loadManifest('links.json')
    .catch(function () {
      return loadManifest('../fruit%20links.json');
    })
    .then(function (data) {
      if (!data || !data.images) throw new Error('Invalid JSON.');
      return data;
    })
    .then(function (data) {
      urls = data.images || [];
      if (!urls.length) throw new Error('No images in JSON.');
      syncFruitScaleFromViewport();
      dockGyroPrompt();
      if (isMobileFruitScale()) {
        requestAnimationFrame(function () {
          syncFruitScaleFromViewport();
          dockGyroPrompt();
          var Wm = window.innerWidth;
          var Hm = window.innerHeight;
          var hm = loneFruitPlayHome(Wm, Hm, fruitFloorMaxPy());
          lastPx = hm.cx;
          lastPy = hm.cy;
          cursorX = lastPx;
          cursorY = lastPy;
          addFruit(lastPx, lastPy);
          applyStarterViewportCenter();
          requestAnimationFrame(loop);
        });
      } else {
        var Wd = window.innerWidth;
        var Hd = window.innerHeight;
        var hd = loneFruitPlayHome(Wd, Hd, fruitFloorMaxPy());
        lastPx = hd.cx;
        lastPy = hd.cy;
        cursorX = lastPx;
        cursorY = lastPy;
        addFruit(lastPx, lastPy);
        if (typeof DeviceOrientationEvent !== 'undefined' && !DeviceOrientationEvent.requestPermission) {
          attachGyro();
        }
        requestAnimationFrame(loop);
      }
    })
    .catch(function (e) {
      errEl.hidden = false;
      errEl.textContent =
        (e && e.message ? e.message : String(e)) +
        ' — from the Fruit_World folder run: ./serve.sh   (or: python3 -m http.server 8080)';
    });
})();
  </script>
</body>
